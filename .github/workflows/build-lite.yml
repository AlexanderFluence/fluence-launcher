name: Compilar Fluence Lite
on:
  push:
    paths:
      - "FluenceLite/**"
      - ".github/workflows/build-lite.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar
        working-directory: FluenceLite
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - run: cp FluenceLite/app/build/outputs/apk/release/app-release.apk FluenceLite.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-v1.${{ github.run_number }}
          name: Fluence Lite 1.${{ github.run_number }}
          files: FluenceLite.apk
