name: Compilar APK
on:
  push:
    paths-ignore:
      - "FluenceLite/**"
      - ".github/workflows/build-lite.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FluenceLauncher.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar
        working-directory: FluenceLauncher
        run: |
          chmod +x gradlew
          ./gradlew assembleRadioDebug assemblePhoneDebug --no-daemon
      - run: |
          cp FluenceLauncher/app/build/outputs/apk/radio/debug/app-radio-debug.apk FluenceLauncher.apk
          cp FluenceLauncher/app/build/outputs/apk/phone/debug/app-phone-debug.apk FluenceDrive.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          files: |
            FluenceLauncher.apk
            FluenceDrive.apk
