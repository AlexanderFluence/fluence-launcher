name: Compilar Fluence GPS
on:
  push:
    paths:
      - "FluenceGPS/**"
      - ".github/workflows/build-gps.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compilar
        working-directory: FluenceGPS
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - run: cp FluenceGPS/app/build/outputs/apk/release/app-release.apk FluenceGPS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: gps-v1.${{ github.run_number }}
          name: Fluence GPS 1.${{ github.run_number }}
          files: FluenceGPS.apk
